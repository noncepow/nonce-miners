[package]
name = "nonce-miner"
version = "0.1.0"
edition = "2021"
description = "Multi-threaded keccak256 proof-of-work miner for NONCE."
license = "MIT"

[lib]
name = "nonce_miner"
path = "src/lib.rs"

[[bin]]
name = "nonce-miner"
path = "src/main.rs"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
primitive-types = { version = "0.12", features = ["rlp"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.5"
ureq = { version = "2.10", features = ["json"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
