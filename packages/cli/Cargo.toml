[package]
name = "nonce-miner"
version = "0.1.0"
edition = "2021"
description = "Multi-threaded keccak256 proof-of-work miner for NONCE."
license = "MIT"

[lib]
name = "nonce_miner"
path = "src/lib.rs"

[[bin]]
name = "nonce-miner"
path = "src/main.rs"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
primitive-types = { version = "0.12", features = ["rlp"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.5"
ureq = { version = "2.10", features = ["json"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }

# GPU backend. Optional so a CPU-only build needs none of it.
# The kernel is compiled at runtime by nvrtc and launched through the driver
# API, so a full CUDA toolkit is not required to build or to run.
cudarc = { version = "0.12", default-features = false, features = ["driver", "nvrtc", "std", "cuda-12060"], optional = true }

[features]
default = ["gpu"]
gpu = ["dep:cudarc"]

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
